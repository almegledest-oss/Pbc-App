  <text x="325" y="62" fill="#FFFFFF" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="24" font-weight="900" letter-spacing="1.5">BUSINESS</text>
  <text x="325" y="90" fill="#FFFFFF" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="24" font-weight="900" letter-spacing="1.5">CLUB</text>
