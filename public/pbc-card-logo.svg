      <stop offset="0%" stop-color="#FFF4B8" />
      <stop offset="30%" stop-color="#E8C14C" />
      <stop offset="70%" stop-color="#DFB338" />
      <stop offset="100%" stop-color="#9C7010" />
    </linearGradient>
    <linearGradient id="pbcTextGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF8D0" />
      <stop offset="100%" stop-color="#DFB338" />
