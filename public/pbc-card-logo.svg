  <!-- PBC Bold Stylized Monogram (Width: 260, Height: 90) -->
  <!-- 'P' with Airplane -->
  <path d="M 10 10 L 80 10 C 115 10 115 58 80 58 L 46 58 L 46 95 L 10 95 Z M 46 28 L 72 28 C 82 28 82 40 72 40 L 46 40 Z" fill="url(#pbcGold)" />
  <!-- Airplane inside/overlapping P -->
