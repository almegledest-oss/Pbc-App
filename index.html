<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>PBC CLUB</title>

    <!-- Standard Favicon -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=3" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=3" />
    <link rel="shortcut icon" href="/favicon.png?v=3" />
    <link rel="preload" as="image" href="/logo.svg?v=3" />

    <!-- Web App Manifest (Android & PWA) -->
    <link rel="manifest" href="/manifest.json?v=3" />

    <!-- iOS / Apple Touch Icon & Home Screen Meta Tags (Deep Navy & Gold Emblem) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png?v=3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PBC CLUB" />

    <!-- Android / Chrome Theme Color -->
    <meta name="theme-color" content="#070D1B" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        try {
          var h = window.location.hostname.toLowerCase();
          var isOfficial = (h === 'probashibusinessclub.com' || h === 'www.probashibusinessclub.com');
          var isDev = (h === 'localhost' || h === '127.0.0.1' || h.indexOf('ais-dev') !== -1 || h.endsWith('.cloudshell.dev'));
          if (!isOfficial && !isDev) {
            // Immediately stop React or cache from showing the app
            window.__IS_LEGACY_LOCKED = true;
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
